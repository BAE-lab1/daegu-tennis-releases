name: Publish verified Windows installer
on:
  push:
    branches: [main]
    paths: ['release-input.json']
permissions:
  contents: write
concurrency:
  group: public-release
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Download and verify installer assets
        shell: python
        run: |
          import hashlib, json, pathlib, re, urllib.request, urllib.parse, zipfile
          data = json.loads(pathlib.Path('release-input.json').read_text())
          version = data['version']
          assert re.fullmatch(r'\d+\.\d+\.\d+', version)
          url = urllib.parse.urlsplit(data['artifact_url'])
          assert url.scheme == 'https' and url.hostname == 'productionresultssa12.blob.core.windows.net'
          request = urllib.request.Request(data['artifact_url'])
          with urllib.request.urlopen(request, timeout=60) as response, open('artifact.zip', 'wb') as out:
              while chunk := response.read(1024 * 1024):
                  out.write(chunk)
          assert hashlib.file_digest(open('artifact.zip', 'rb'), 'sha256').hexdigest() == data['artifact_sha256']
          expected = 'DaeguTennis-Setup-' + version + '.exe'
          folder = pathlib.Path('release-assets'); folder.mkdir()
          with zipfile.ZipFile('artifact.zip') as archive:
              assert len(archive.namelist()) == 2
              assert {pathlib.PurePosixPath(x).name for x in archive.namelist()} == {expected, 'update.json'}
              for name in (expected, 'update.json'):
                  matches = [x for x in archive.namelist() if pathlib.PurePosixPath(x).name == name]
                  assert len(matches) == 1, (name, matches)
                  with archive.open(matches[0]) as src, (folder/name).open('wb') as out:
                      while chunk := src.read(1024 * 1024):
                          out.write(chunk)
          manifest = json.loads((folder/'update.json').read_text())
          installer = folder/expected
          sha = hashlib.file_digest(installer.open('rb'), 'sha256').hexdigest()
          assert manifest['version'] == version
          assert manifest['size'] == installer.stat().st_size and manifest['sha256'] == sha
          assert manifest['url'] == 'https://github.com/BAE-lab1/daegu-tennis-releases/releases/download/v' + version + '/' + expected
          (folder/'SHA256.txt').write_text(sha + '  ' + expected + '\n')
          pathlib.Path('release-notes.md').write_text('대구 테니스 ' + version + '\n\nWindows 설치 EXE를 실행하세요. Python 설치는 필요하지 않습니다.\n\n하루 전체 시설 조회에 자동 조회(기본 60초, 30~3600초)와 변경 칸 테두리를 추가했습니다. 초록=새 빈자리, 주황=빈자리 종료, 보라=기타 변경. 칸 클릭 시 이전·현재 상태와 감지 시각을 표시합니다.\n\n조회 실패·누락은 마지막 정상 상태를 유지하고 빨간 선으로 표시합니다. 예약·대기 중에는 일시정지하며, 중지 또는 창 닫기로 반복 조회를 종료합니다. 기존 설정은 유지됩니다.\n\nWindows 테스트 302개 및 설치 전·후 자체 검사 통과.\n', encoding='utf-8')
      - name: Publish installer and update manifest
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          version=$(python -c "import json; print(json.load(open('release-input.json'))['version'])")
          gh release create "v$version" release-assets/* --target "$GITHUB_SHA" --title "대구 테니스 $version" --notes-file release-notes.md --latest
      - name: Verify anonymous public downloads
        shell: python
        run: |
          import hashlib, json, urllib.request
          base = 'https://github.com/BAE-lab1/daegu-tennis-releases/releases/latest/download/update.json'
          with urllib.request.urlopen(base, timeout=60) as response:
              manifest = json.load(response)
          expected = json.load(open('release-assets/update.json'))
          assert manifest == expected
          digest = hashlib.sha256(); total = 0
          with urllib.request.urlopen(manifest['url'], timeout=60) as response:
              while chunk := response.read(1024 * 1024):
                  digest.update(chunk); total += len(chunk)
          assert total == manifest['size'] and digest.hexdigest() == manifest['sha256']
          print('Anonymous installer and update feed checks passed.')
